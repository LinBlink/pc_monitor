# PC Monitor settings - muOS (Anbernic RG35XX Pro and friends).
#
# PC_HOST is only the seed: it is what gets shown while the background subnet
# sweep runs, and the fallback if the sweep finds nothing. Discovered devices are
# cached in hosts.txt (delete it to force a clean rescan).
PC_HOST=192.168.2.114

# The port to look for. Every PC you want to monitor must use the same one.
PC_PORT=8765

# Fallback frame rate, used only if the PC's /config.json cannot be read.
# The live value comes from the PC's settings page, so change it there.
STREAM_FPS=8

# Is this handheld's panel mounted upside down? The Miyoo's is, which is why
# the PC pre-rotates every frame 180 degrees (`rotate180` in the PC's
# config.json). This one is not, so the launcher cancels that out per PC.
#
# It is cancelled here rather than turned off on the PC because the setting is
# per-PC and the Miyoo still needs it on - and because doing it here works
# against PCs running any build, with nothing to update at the other end.
#
# Leave it at 0. Set it to 1 only if all four of Y's positions come out wrong
# by the same 180 degrees, which would mean this panel is upside down too.
PANEL_FLIP=0

# Battery: the level is reported to the PC every BATT_EVERY_S seconds so it can
# be drawn in the header. Below BATT_LOW_PCT and not charging, the motor buzzes
# at most once every BATT_BUZZ_GAP_S. BATT_LOW_PCT=0 turns the buzz off and
# leaves the reporting alone.
BATT_EVERY_S=60
BATT_LOW_PCT=15
BATT_BUZZ_GAP_S=600
